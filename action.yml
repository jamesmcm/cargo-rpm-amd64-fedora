# action.yml
name: 'Rust Cargo Generate Rpm Package Build (amd64, Fedora)'
description: 'Builds a rpm package, amd64, fedora 44'
branding:
  icon: 'package'
  color: 'orange'
inputs:
  cmd:
    description: 'build command'
    required: true
    default: 'fedora_version="$(rpm --eval ''%{?fedora}'')" && test -n "$fedora_version" && cargo build --release && cargo generate-rpm --variant fedora --set-metadata "release = ''1.fc${fedora_version}''"'
runs:
  using: 'docker'
  image: 'docker://jamesmcm03/cargo-rpm-amd64-fedora:20260530'
  args:
    - ${{ inputs.cmd }}
